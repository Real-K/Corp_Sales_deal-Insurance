# 공격 시나리오 (BREAK 2). 확정 뒤 고쳐진(다시 확정되지 않은) CEO 보고서 판을 근거로 설계안을 확정한다.
# expect는 world.yaml·seed.yaml로 손으로 판정(desk-check)한 예측이다.
# because: 상태 → 역할 → 전이의 guard 전부의 참·거짓 → 실패 목록.
#   guard를 첫 실패에서 멈추든 끝까지 평가하든 판정과 실패 목록이 같도록 모든 guard 값을 적는다.
scenario:
  name: proposal-on-revised-unconfirmed-report
  kind: adversarial
  record: D-2005
  protects: "설계안은 확정된 CEO 보고서 판에만 근거해야 한다. 확정 뒤 고쳐진 판은 다시 확정받아야 한다."
  steps:
    - input: "D-2005의 보고서 CR-2005는 v1로 확정된 뒤 v2로 고쳐졌다(version 2, confirmed_version 1). 담당 GFC gfc-01이 v2를 근거로 한 설계안 PD-2005(report_version 2)를 확정한다."
      as: gfc-01
      transition: confirm_proposal
      expect: DENY                # AFTER 예측. BEFORE 예측(ALLOW)은 assignment/break-fix.md
      because: >
        상태: report_confirmed = confirm_proposal.from ✓. 역할: gfc-01의 역할 gfc ✓.
        C1: gfc-01 == gfc-01 → 참.
        C8_uses_confirmed_report: proposal.report_version (2) == ceo_report.confirmed_version (1) → 거짓.
        C9: 80,000,000 <= 100,000,000 → 참.
        C13_report_unchanged_since_confirm: ceo_report.version (2) == confirmed_version (1) → 거짓.
        실패: C8, C13 → DENY. C8과 C13이 이중으로 막는다.
