# 공격 시나리오 (BREAK). 확정된 CEO 보고서(v1)가 아닌 판(v2)을 근거로 만든 설계안을 확정하려 한다.
# expect는 world.yaml·seed.yaml로 손으로 판정(desk-check)한 예측이다.
# because: 상태 → 역할 → 전이의 guard 전부의 참·거짓 → 실패 목록.
#   guard를 첫 실패에서 멈추든 끝까지 평가하든 판정과 실패 목록이 같도록 모든 guard 값을 적는다.
scenario:
  name: proposal-on-unconfirmed-report-version
  kind: adversarial
  record: D-2002
  protects: "설계안은 확정된 CEO 보고서 판에만 근거해야 한다."
  steps:
    - input: "D-2002의 보고서 CR-2002는 v1로 확정됐다(version 1, confirmed_version 1). 담당 GFC gfc-01이 report_version 2를 근거로 한 설계안 PD-2002를 확정한다."
      as: gfc-01
      transition: confirm_proposal
      expect: DENY
      because: >
        상태: report_confirmed = confirm_proposal.from ✓. 역할: gfc-01의 역할 gfc ✓.
        C1: gfc-01 == gfc-01 → 참.
        C8_uses_confirmed_report: proposal.report_version (2) == ceo_report.confirmed_version (1) → 거짓.
        C9: 80,000,000 <= 100,000,000 → 참.
        C13: ceo_report.version (1) == confirmed_version (1) → 참.
        실패: C8 → DENY.
