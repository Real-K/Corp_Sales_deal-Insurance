# 공격 시나리오 (BREAK). CEO 보고서 확정 전에 제안 설계안을 확정하려 한다.
# expect는 world.yaml·seed.yaml로 손으로 판정(desk-check)한 예측이다.
# because: 상태 → 역할 → 전이의 guard 전부의 참·거짓 → 실패 목록.
#   guard를 첫 실패에서 멈추든 끝까지 평가하든 판정과 실패 목록이 같도록 모든 guard 값을 적는다.
scenario:
  name: proposal-before-report-confirmed
  kind: adversarial
  record: D-2001
  protects: "CEO 보고서가 확정되기 전에는 제안 설계안을 확정할 수 없다."
  steps:
    - input: "D-2001은 report_drafted다(CR-2001 v1, confirmed_version 0 = 미확정). 담당 GFC gfc-01이 제안 설계안 PD-2001을 확정한다."
      as: gfc-01
      transition: confirm_proposal
      expect: DENY
      because: >
        상태: D-2001은 report_drafted ≠ confirm_proposal.from (report_confirmed) ✗.
        역할: gfc-01의 역할 gfc ✓.
        guard (평가하더라도): C1 gfc-01 == gfc-01 → 참 ·
        C8 report_version (1) == confirmed_version (0) → 거짓 ·
        C9 80,000,000 <= 100,000,000 → 참 ·
        C13 version (1) == confirmed_version (0) → 거짓.
        실패: 상태 (guard까지 본다면 C8·C13도 거짓) → DENY.
        업무 사이 순서는 guard가 아니라 State 흐름이 막는다.
