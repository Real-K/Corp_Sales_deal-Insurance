# 공격 시나리오 (BREAK 2 · 추가 확인). 확정본(v1)을 근거로 한 설계안이지만, 확정 뒤 보고서가 v2로 바뀌었다 (C13 단독).
# expect는 world.yaml·seed.yaml로 손으로 판정(desk-check)한 예측이다.
# because: 상태 → 역할 → 전이의 guard 전부의 참·거짓 → 실패 목록.
#   guard를 첫 실패에서 멈추든 끝까지 평가하든 판정과 실패 목록이 같도록 모든 guard 값을 적는다.
scenario:
  name: proposal-after-report-changed-since-confirm
  kind: adversarial
  record: D-2006
  protects: "확정한 뒤 보고서가 바뀌었으면, 그 확정을 근거로 설계안을 확정할 수 없다."
  steps:
    - input: "D-2006의 보고서 CR-2006은 v1로 확정된 뒤 v2로 바뀌었다(version 2, confirmed_version 1). 담당 GFC gfc-01이 v1을 근거로 한 설계안 PD-2006(report_version 1)을 확정한다."
      as: gfc-01
      transition: confirm_proposal
      expect: DENY
      because: >
        상태: report_confirmed = confirm_proposal.from ✓. 역할: gfc-01의 역할 gfc ✓.
        C1: gfc-01 == gfc-01 → 참.
        C8: proposal.report_version (1) == ceo_report.confirmed_version (1) → 참.
        C9: 80,000,000 <= 100,000,000 → 참.
        C13_report_unchanged_since_confirm: ceo_report.version (2) == confirmed_version (1) → 거짓.
        실패: C13 → DENY. C13 하나만 거짓이다.
