# gfc-corporate-deal 시나리오의 시작 레코드
#
# 약속 (world.yaml 머리말 "값과 식의 해석 약속"과 같다)
#  · 모든 값은 예시다. 실제 법인·담당자·금액이 아니다. money는 원(KRW).
#  · 모든 레코드는 world.yaml에 선언된 속성을 빠짐없이 갖는다. 없는 값·null은 없다.
#  · ref 값(analysis·expert_request·ceo_report·proposal)은 아래 다른 type 레코드의 id다.
#  · 딜마다 산출물 레코드 4개(AR·ER·CR·PD-<번호>)를 따로 가진다.
#  · 전이는 값을 바꾸지 않는다. 각 딜에는 시나리오의 모든 단계가 평가할 값을 처음부터 넣는다.
records:

  # ── D-1001: 정상 시나리오. opened → registered (기준액 이하 경로, 9개 전이) ──
  - type: Deal
    id: D-1001
    status: opened
    attributes:
      corp: CORP-001
      gfc: gfc-01
      dept_head: head-01
      meeting_held: true
      opinions_expected: 2
      opinions_received: 2
      analysis: AR-1001
      expert_request: ER-1001
      ceo_report: CR-1001
      proposal: PD-1001
  - type: AnalysisReport
    id: AR-1001
    attributes:
      corp: CORP-001
      version: 1
  - type: ExpertRequest
    id: ER-1001
    attributes:
      version: 1
      approved_version: 1
      experts: "tax-01,law-01"
  - type: CEOReport
    id: CR-1001
    attributes:
      version: 1
      confirmed_version: 1
      conflicts: 0
      resolution: ""
  - type: ProposalDesign
    id: PD-1001
    attributes:
      report_version: 1
      premium_total: 80000000

  # ── D-2001: 공격. CEO 보고서가 아직 초안(미확정)인데 설계안 확정 ──
  - type: Deal
    id: D-2001
    status: report_drafted
    attributes:
      corp: CORP-002
      gfc: gfc-01
      dept_head: head-01
      meeting_held: true
      opinions_expected: 2
      opinions_received: 2
      analysis: AR-2001
      expert_request: ER-2001
      ceo_report: CR-2001
      proposal: PD-2001
  - type: AnalysisReport
    id: AR-2001
    attributes:
      corp: CORP-002
      version: 1
  - type: ExpertRequest
    id: ER-2001
    attributes:
      version: 1
      approved_version: 1
      experts: "tax-01,law-01"
  - type: CEOReport
    id: CR-2001
    attributes:
      version: 1
      confirmed_version: 0                # 0 = 미확정
      conflicts: 0
      resolution: ""
  - type: ProposalDesign
    id: PD-2001
    attributes:
      report_version: 1
      premium_total: 80000000

  # ── D-2002: 공격. 보고서는 v1로 확정, 설계안은 확정되지 않은 v2를 근거로 함 ──
  - type: Deal
    id: D-2002
    status: report_confirmed
